version: '3.8'

services:
  movie-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: movie-app
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
    restart: unless-stopped
    networks:
      - movie-network

networks:
  movie-network:
    driver: bridge
